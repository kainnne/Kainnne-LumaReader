name: Qiyue Zhiwai Mac notarization

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qiyue-zhiwai-notarize-20260919
  cancel-in-progress: false

jobs:
  notarize:
    runs-on: macos-15
    environment: release
    timeout-minutes: 55
    steps:
      - name: Download the approved signed game
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p staging output
          gh release download qiyue-notary-staging-20260919 --repo kainnne/Kainnne-LumaReader --pattern Qiyue-Zhiwai-2.2.1-macOS-signed-for-notary.zip --dir staging
          cd staging
          echo '583e1e92dc53dafe0973285dbd3ed9891ddc6efbb996c5a42a56f5845d1893ec  Qiyue-Zhiwai-2.2.1-macOS-signed-for-notary.zip' | shasum -a 256 --check
          ditto -x -k Qiyue-Zhiwai-2.2.1-macOS-signed-for-notary.zip .
          codesign --verify --deep --strict '契約之外-2.2.1.app'
          codesign -d --verbose=4 '契約之外-2.2.1.app' 2>&1 | grep -F 'TeamIdentifier=56B9GB8VQ3'

      - name: Submit the signed game to Apple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test "$APPLE_TEAM_ID" = '56B9GB8VQ3'
          xcrun notarytool submit staging/Qiyue-Zhiwai-2.2.1-macOS-signed-for-notary.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --timeout 40m --output-format json > output/submission.json
          SUBMISSION_ID=$(python3 -c 'import json; print(json.load(open("output/submission.json"))["id"])')
          xcrun notarytool log "$SUBMISSION_ID" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" output/notary-log.json
          python3 - <<'PY'
          import json
          s=json.load(open('output/submission.json'))
          print('Apple notarization:',s.get('status'))
          assert s.get('status') == 'Accepted', s
          log=json.load(open('output/notary-log.json'))
          assert not log.get('issues'), log.get('issues')
          PY

      - name: Staple and package the notarized app
        run: |
          set -euo pipefail
          xcrun stapler staple 'staging/契約之外-2.2.1.app'
          xcrun stapler validate 'staging/契約之外-2.2.1.app'
          codesign --verify --deep --strict 'staging/契約之外-2.2.1.app'
          spctl --assess --type execute --verbose=4 'staging/契約之外-2.2.1.app'
          ditto -c -k --sequesterRsrc --keepParent 'staging/契約之外-2.2.1.app' output/Qiyue-Zhiwai-2.2.1-macOS.zip
          cd output
          shasum -a 256 Qiyue-Zhiwai-2.2.1-macOS.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qiyue-zhiwai-mac-notarized-20260919
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: output/
