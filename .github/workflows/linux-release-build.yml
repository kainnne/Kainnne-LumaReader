name: Linux release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    # Build on the older supported distribution, then verify these exact packages
    # on Ubuntu 24.04 in the dependent job below.
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      CI: "true"
    steps:
      - name: Isolate application preferences
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/lumareader-linux-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/lumareader-linux-data" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Read package version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies and display test tools
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 desktop-file-utils libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2

      - name: Check and test source
        run: |
          npm run check
          npm test
          bash -n build/linux-AppRun

      - name: Build Linux x64 packages
        run: npm run dist:linux

      - name: Prepare existing Markdown default for preservation tests
        run: node scripts/linux-smoke.js prepare

      - name: Smoke-test the actual AppImage with extraction mode and sandbox enabled
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x1080x24" dbus-run-session -- node scripts/linux-smoke.js appimage

      - name: Install the actual Debian package
        env:
          VERSION: ${{ steps.package-version.outputs.version }}
        run: sudo apt-get install -y "./dist/Kainnne-LumaReader-${VERSION}-Linux-x64.deb"

      - name: Smoke-test installed Debian package and existing defaults
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x1080x24" dbus-run-session -- node scripts/linux-smoke.js installed

      - name: Remove the CI installation and verify default preservation
        run: |
          sudo apt-get remove -y kainnne-lumareader
          node scripts/linux-smoke.js verify-defaults

      - name: Record Linux checksums
        working-directory: dist
        env:
          VERSION: ${{ steps.package-version.outputs.version }}
        run: sha256sum "Kainnne-LumaReader-${VERSION}-Linux-x64.AppImage" "Kainnne-LumaReader-${VERSION}-Linux-x64.deb" > linux-sha256.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Kainnne-LumaReader-${{ steps.package-version.outputs.version }}-Linux-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Kainnne-LumaReader-${{ steps.package-version.outputs.version }}-Linux-x64.AppImage
            dist/Kainnne-LumaReader-${{ steps.package-version.outputs.version }}-Linux-x64.deb
            dist/linux-appimage-smoke-results.json
            dist/linux-installed-smoke-results.json
            dist/linux-defaults-results.json
            dist/linux-sha256.txt

      - name: Upload Linux smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Linux-Ubuntu-22.04-smoke-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: dist/smoke-diagnostics/

  verify-ubuntu-24:
    needs: build-and-smoke-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Isolate application preferences
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/lumareader-linux-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/lumareader-linux-data" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Read package version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Kainnne-LumaReader-${{ steps.package-version.outputs.version }}-Linux-x64
          path: dist

      - name: Verify the same package checksums
        working-directory: dist
        run: sha256sum --check linux-sha256.txt

      - name: Install dependencies and display test tools
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 desktop-file-utils

      - name: Prepare existing Markdown default for preservation tests
        run: node scripts/linux-smoke.js prepare

      - name: Install the Debian package using its bundled AppArmor profile
        env:
          VERSION: ${{ steps.package-version.outputs.version }}
        run: sudo apt-get install -y "./dist/Kainnne-LumaReader-${VERSION}-Linux-x64.deb"

      - name: Smoke-test the installed app with sandbox enabled
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x1080x24" dbus-run-session -- node scripts/linux-smoke.js installed

      - name: Remove the CI installation and verify default preservation
        run: |
          sudo apt-get remove -y kainnne-lumareader
          node scripts/linux-smoke.js verify-defaults

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Kainnne-LumaReader-${{ steps.package-version.outputs.version }}-Linux-Ubuntu-24.04-validation
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/linux-installed-smoke-results.json
            dist/linux-defaults-results.json

      - name: Upload Linux smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Linux-Ubuntu-24.04-smoke-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: dist/smoke-diagnostics/
