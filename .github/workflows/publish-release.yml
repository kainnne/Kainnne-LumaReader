name: Publish validated release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 1.3.0
      target_sha:
        description: Verified source commit to tag
        required: true
      macos_run_id:
        description: Successful macOS signed release build run ID
        required: true
      windows_run_id:
        description: Successful Windows release build run ID
        required: true
      linux_run_id:
        description: Successful Linux build and Ubuntu 22.04 / 24.04 validation run ID
        required: true

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: verify artifacts and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_sha }}

      - name: Verify all three builds succeeded from the exact source commit
        env:
          MACOS_RUN_ID: ${{ inputs.macos_run_id }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
          LINUX_RUN_ID: ${{ inputs.linux_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          for platform in macos windows linux; do
            case "$platform" in
              macos) run_id="$MACOS_RUN_ID" ;;
              windows) run_id="$WINDOWS_RUN_ID" ;;
              linux) run_id="$LINUX_RUN_ID" ;;
            esac
            [[ "$run_id" =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$platform-run.json"
            jq -e --arg sha "$TARGET_SHA" --arg workflow ".github/workflows/$platform-release-build.yml" \
              '.head_sha == $sha and .status == "completed" and .conclusion == "success" and .path == $workflow' "$platform-run.json"
          done

      - name: Download verified macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Kainnne-LumaReader-${{ inputs.version }}-macOS-universal-signed-notarized
          path: release-assets/macos
          repository: ${{ github.repository }}
          run-id: ${{ inputs.macos_run_id }}
          github-token: ${{ github.token }}

      - name: Download verified Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Kainnne-LumaReader-${{ inputs.version }}-Windows-x64
          path: release-assets/windows
          repository: ${{ github.repository }}
          run-id: ${{ inputs.windows_run_id }}
          github-token: ${{ github.token }}

      - name: Download verified Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Kainnne-LumaReader-${{ inputs.version }}-Linux-x64
          path: release-assets/linux
          repository: ${{ github.repository }}
          run-id: ${{ inputs.linux_run_id }}
          github-token: ${{ github.token }}

      - name: Verify exact release assets and create checksums
        shell: bash
        run: |
          set -euo pipefail

          mac_dmg="release-assets/macos/Kainnne-LumaReader-${VERSION}-macOS-universal.dmg"
          mac_zip="release-assets/macos/Kainnne-LumaReader-${VERSION}-macOS-universal.zip"
          win_setup="release-assets/windows/Kainnne-LumaReader-${VERSION}-Windows-x64-Setup.exe"
          win_portable="release-assets/windows/Kainnne-LumaReader-${VERSION}-Windows-x64-Portable.exe"

          linux_appimage="release-assets/linux/Kainnne-LumaReader-${VERSION}-Linux-x64.AppImage"
          linux_deb="release-assets/linux/Kainnne-LumaReader-${VERSION}-Linux-x64.deb"

          for asset in "$mac_dmg" "$mac_zip" "$win_setup" "$win_portable" "$linux_appimage" "$linux_deb"; do
            test -s "$asset"
          done

          package_version="$(node -p "require('./package.json').version")"
          test "$package_version" = "$VERSION"
          git cat-file -e "${TARGET_SHA}^{commit}"

          checksum_file="release-assets/Kainnne-LumaReader-${VERSION}-SHA256SUMS.txt"
          sha256sum "$mac_dmg" "$mac_zip" "$win_setup" "$win_portable" "$linux_appimage" "$linux_deb" \
            | sed 's#release-assets/macos/##; s#release-assets/windows/##; s#release-assets/linux/##' \
            > "$checksum_file"
          cat "$checksum_file"

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; refusing to overwrite it." >&2
            exit 1
          fi

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Kainnne LumaReader ${VERSION}" \
            --notes-file "docs/RELEASE-NOTES-${VERSION}.md" \
            "release-assets/macos/Kainnne-LumaReader-${VERSION}-macOS-universal.dmg" \
            "release-assets/macos/Kainnne-LumaReader-${VERSION}-macOS-universal.zip" \
            "release-assets/windows/Kainnne-LumaReader-${VERSION}-Windows-x64-Setup.exe" \
            "release-assets/windows/Kainnne-LumaReader-${VERSION}-Windows-x64-Portable.exe" \
            "release-assets/linux/Kainnne-LumaReader-${VERSION}-Linux-x64.AppImage" \
            "release-assets/linux/Kainnne-LumaReader-${VERSION}-Linux-x64.deb" \
            "release-assets/Kainnne-LumaReader-${VERSION}-SHA256SUMS.txt"
