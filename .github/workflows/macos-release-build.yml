name: macOS signed release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sign-notarize-and-smoke-test:
    runs-on: macos-15
    environment:
      name: release
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Read package version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify release secrets are configured
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for variable in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "Required release secret is missing: $variable" >&2
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Check and test source
        run: |
          npm run check
          npm test

      - name: Build, sign, and notarize macOS universal packages
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Verify signature, notarization ticket, and architectures
        env:
          VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          APP_PATH="dist/mac-universal/Kainnne LumaReader.app"
          EXECUTABLE="$APP_PATH/Contents/MacOS/Kainnne LumaReader"
          test -d "$APP_PATH"
          test -f "dist/Kainnne-LumaReader-${VERSION}-macOS-universal.dmg"
          test -f "dist/Kainnne-LumaReader-${VERSION}-macOS-universal.zip"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -F "Authority=Developer ID Application"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          ARCHITECTURES="$(lipo -archs "$EXECUTABLE")"
          [[ "$ARCHITECTURES" == *arm64* ]]
          [[ "$ARCHITECTURES" == *x86_64* ]]
          echo "Verified universal architectures: $ARCHITECTURES"

      - name: Smoke-test signed and notarized application
        run: node scripts/macos-smoke.js "dist/mac-universal/Kainnne LumaReader.app/Contents/MacOS/Kainnne LumaReader"

      - name: Record macOS checksums
        working-directory: dist
        env:
          VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          shasum -a 256 \
            Kainnne-LumaReader-${VERSION}-macOS-universal.dmg \
            Kainnne-LumaReader-${VERSION}-macOS-universal.zip \
            > macos-sha256.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Kainnne-LumaReader-${{ steps.package-version.outputs.version }}-macOS-universal-signed-notarized
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Kainnne-LumaReader-${{ steps.package-version.outputs.version }}-macOS-universal.dmg
            dist/Kainnne-LumaReader-${{ steps.package-version.outputs.version }}-macOS-universal.zip
            dist/macos-smoke-results.json
            dist/macos-sha256.txt
